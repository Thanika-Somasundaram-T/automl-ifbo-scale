pipeline_space:
  lr:
    type: categorical
    choices: [1e-4, 3e-4, 1e-3, 1e-2]

  num_layers: 4

  hidden_dim:
    type: categorical
    choices: [128, 512]

  weight_decay:
    type: categorical
    choices: [0.0, 1e-4, 1e-3]

  lr_schedule: "cosine"

  epochs:
    type: categorical
    choices: [10, 15, 30, 45, 50, 70, 90]

  batch_size: 96
  use_context: true

optimizer: grid_search
max_evaluations_total: 300
