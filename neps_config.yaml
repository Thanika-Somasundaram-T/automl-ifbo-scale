pipeline_space:
  lr:
    type: categorical
    choices: [1e-3, 1e-2]

  num_layers: 4

  hidden_dim:
    type: categorical
    choices: [32, 64, 128]  # width scaling

  weight_decay:
    type: categorical
    choices: [0.0, 1e-4, 1e-3]

  lr_schedule:
    type: categorical
    choices: ["none", "warmup", "cosine", "cooldown", "warmup_cooldown"]

  epochs: 100

  batch_size: 96

optimizer: grid_search
max_evaluations_total: 90
