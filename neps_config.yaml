pipeline_space:
  lr:
    type: categorical
    choices: [1e-4, 3e-4, 1e-3, 3e-3, 1e-2]

  num_layers: 2

  hidden_dim:
    type: categorical
    choices: [16, 32, 64]  # width scaling

  weight_decay:
    type: categorical
    choices: [0.0, 1e-4, 1e-3]

  lr_schedule:
    type: categorical
    choices: ["none", "warmup", "cosine", "cooldown", "warmup_cooldown"]

  epochs: 30

  batch_size: 96

optimizer: grid_search
max_evaluations_total: 225
