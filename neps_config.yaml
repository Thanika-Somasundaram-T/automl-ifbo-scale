pipeline_space:
  # Learning rates: pick 5 values logarithmically spaced
  lr:
    type: categorical
    choices: [1e-5, 3e-5, 1e-4, 3e-4, 1e-3]

  # Number of layers fixed
  num_layers: 4

  # Hidden dimensions
  hidden_dim:
    type: categorical
    choices: [4, 8, 16, 24, 32, 64, 128]

  # Weight decay: 2 choices
  weight_decay:
    type: categorical
    choices: [0.0, 0.01]

  # Learning rate schedule
  lr_schedule: "cosine"

  # Training parameters
  epochs: 150
  batch_size: 96

optimizer: grid_search

# Maximum number of total evaluations (all combinations)
max_evaluations_total: 70
